<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perfil - LoveTrack</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 20px;
            text-align: center;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--gradient-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-soft);
            border: 4px solid var(--card-bg);
        }
        .profile-name {
            font-size: 24px;
            margin-bottom: 4px;
        }
        .profile-email {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        
        .pairing-code {
            background: rgba(255, 75, 114, 0.1);
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 18px;
            margin-bottom: 8px;
            display: inline-block;
        }
        .pairing-text {
            font-size: 12px;
            color: var(--text-muted);
        }

        .settings-group {
            margin-top: 24px;
            padding: 0 20px;
        }
        .settings-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .setting-item {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--border-radius-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            border: 1px solid rgba(0,0,0,0.05);
        }
        [data-theme="dark"] .setting-item { border-color: rgba(255,255,255,0.05); }
        .setting-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            color: var(--text-main);
        }
        .setting-label i {
            color: var(--primary-color);
            font-size: 20px;
            width: 24px;
            text-align: center;
        }
        
        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(22px); }
        

    </style>
</head>
<body>
    <div class="app-container">
        
        <div class="content-area" style="padding: 0;">
            <div class="profile-header animate-fade-in">
                <div class="profile-avatar">M</div>
                <h2 class="profile-name">Mi Nombre</h2>
                <p class="profile-email">usuario@correo.com</p>
                
                <div style="margin-top: 16px;">
                    <div class="pairing-code">LV-892A</div>
                    <div class="pairing-text">Código de pareja. Compártelo para conectar.</div>
                </div>
            </div>
            
            <div class="settings-group animate-fade-in" style="animation-delay: 0.1s;">
                <div class="settings-title">Configuración</div>
                
                <div class="setting-item">
                    <div class="setting-label">
                        <i class="fa-solid fa-moon"></i> Modo Oscuro
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="darkModeToggle">
                        <span class="slider"></span>
                    </label>
                </div>
                
                <div class="setting-item">
                    <div class="setting-label">
                        <i class="fa-solid fa-location-dot"></i> Compartir Ubicación
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="locationToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                
                <div class="setting-item">
                    <div class="setting-label">
                        <i class="fa-solid fa-bell"></i> Notificaciones
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="notificationsToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            

        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav glass">
            <a href="home.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Inicio</span>
            </a>
            <a href="map.html" class="nav-item">
                <i class="fa-solid fa-map-location-dot"></i>
                <span>Mapa</span>
            </a>
            <a href="chat.html" class="nav-item">
                <i class="fa-solid fa-comment-dots"></i>
                <span>Chat</span>
            </a>
            <a href="moments.html" class="nav-item">
                <i class="fa-solid fa-images"></i>
                <span>Momentos</span>
            </a>
            <a href="profile.html" class="nav-item active">
                <i class="fa-solid fa-user"></i>
                <span>Perfil</span>
            </a>
        </nav>
    </div>
    
    <script type="module" src="js/firebase.js"></script>

    <script src="js/app.js"></script>
</body>
</html>
