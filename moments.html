<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Momentos - LoveTrack</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 24px;
            color: var(--primary-color);
        }
        .add-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gradient-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            font-size: 18px;
            box-shadow: var(--shadow-soft);
            cursor: pointer;
        }
        .timeline {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .moment-card {
            background: var(--card-bg);
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-glass);
            border: 1px solid rgba(0,0,0,0.05);
        }
        [data-theme="dark"] .moment-card { border-color: rgba(255,255,255,0.05); }
        .moment-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: var(--primary-light); /* Placeholder */
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
        }
        .moment-content {
            padding: 16px;
        }
        .moment-date {
            font-size: 12px;
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 8px;
        }
        .moment-text {
            font-size: 14px;
            color: var(--text-main);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <div class="header">
            <h1>Momentos ❤️</h1>
            <button class="add-btn"><i class="fa-solid fa-plus"></i></button>
        </div>
        
        <div class="content-area" style="padding-top: 0;">
            <div class="timeline" id="momentsTimeline">
                <!-- Mock Moments -->
                <div class="moment-card animate-fade-in">
                    <div class="moment-img">
                        <i class="fa-solid fa-image"></i>
                    </div>
                    <div class="moment-content">
                        <div class="moment-date">14 de Febrero, 2024</div>
                        <div class="moment-text">Nuestro primer viaje juntos. ¡Qué increíble fin de semana! ✨</div>
                    </div>
                </div>
                
                <div class="moment-card animate-fade-in" style="animation-delay: 0.1s;">
                    <div class="moment-img" style="background-color: #a29bfe;">
                        <i class="fa-solid fa-camera-retro"></i>
                    </div>
                    <div class="moment-content">
                        <div class="moment-date">1 de Enero, 2024</div>
                        <div class="moment-text">Empezando el año con la mejor compañía. 🎉</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav glass">
            <a href="home.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Inicio</span>
            </a>
            <a href="map.html" class="nav-item">
                <i class="fa-solid fa-map-location-dot"></i>
                <span>Mapa</span>
            </a>
            <a href="chat.html" class="nav-item">
                <i class="fa-solid fa-comment-dots"></i>
                <span>Chat</span>
            </a>
            <a href="moments.html" class="nav-item active">
                <i class="fa-solid fa-images"></i>
                <span>Momentos</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>Perfil</span>
            </a>
        </nav>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
