<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Mapa - LoveTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body, .app-container { overflow: hidden; }

        .map-wrapper {
            position: absolute;
            top: 0; left: 0; right: 0;
            bottom: calc(64px + env(safe-area-inset-bottom));
            z-index: 1;
        }
        #map { width: 100%; height: 100%; }

        /* Overlay superior */
        .map-overlay {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            left: 16px; right: 16px;
            z-index: 400;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }
        .map-overlay > * { pointer-events: auto; }

        .map-card {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 16px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-glass);
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.25);
        }
        [data-theme="dark"] .map-card { border-color: rgba(255,255,255,0.06); }
        .distance-badge {
            font-weight: 800;
            color: var(--primary-color);
            font-size: 18px;
        }
        .distance-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Botones de control */
        .map-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .map-btn {
            width: 46px; height: 46px;
            border-radius: 14px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: var(--shadow-glass);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text-main);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .map-btn:active { transform: scale(0.9); }
        .map-btn.primary {
            background: var(--gradient-primary);
            color: white;
            border-color: transparent;
        }
        [data-theme="dark"] .map-btn { border-color: rgba(255,255,255,0.06); }

        /* Bottom Nav encima del mapa */
        .bottom-nav {
            z-index: 500;
        }

        /* Leaflet tweaks */
        .leaflet-control-attribution {
            font-size: 9px !important;
            background: rgba(255,255,255,0.7) !important;
            backdrop-filter: blur(4px);
        }
        [data-theme="dark"] .leaflet-control-attribution {
            background: rgba(0,0,0,0.5) !important;
            color: #aaa !important;
        }

        /* Sin GPS banner */
        .no-gps-banner {
            position: absolute;
            bottom: calc(80px + env(safe-area-inset-bottom));
            left: 16px; right: 16px;
            z-index: 500;
            background: rgba(255,75,114,0.95);
            color: white;
            padding: 14px 18px;
            border-radius: var(--border-radius-md);
            font-size: 13px;
            font-weight: 600;
            display: none;
            text-align: center;
            box-shadow: var(--shadow-strong);
        }
        .no-gps-banner.show { display: block; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="map-wrapper">
            <div id="map"></div>

            <!-- Overlay -->
            <div class="map-overlay">
                <!-- Distancia -->
                <div class="map-card">
                    <i class="fa-solid fa-route" style="color:var(--primary-color);font-size:20px;"></i>
                    <div>
                        <div class="distance-label">Distancia</div>
                        <div class="distance-badge" id="mapDistance">-- km</div>
                    </div>
                </div>

                <!-- Controles -->
                <div class="map-controls">
                    <button class="map-btn primary" id="centerMapBtn" title="Mi ubicación">
                        <i class="fa-solid fa-location-crosshairs"></i>
                    </button>
                    <button class="map-btn" id="centerPartnerBtn" title="Ver pareja">
                        <i class="fa-solid fa-heart"></i>
                    </button>
                    <button class="map-btn" id="centerBothBtn" title="Ver ambos">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>
            </div>

            <!-- Banner sin GPS -->
            <div class="no-gps-banner" id="noGpsBanner">
                📍 Activa el GPS para compartir tu ubicación
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav glass" style="position:fixed;">
            <a href="home.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Inicio</span>
            </a>
            <a href="map.html" class="nav-item active">
                <i class="fa-solid fa-map-location-dot"></i>
                <span>Mapa</span>
            </a>
            <a href="chat.html" class="nav-item">
                <i class="fa-solid fa-comment-dots"></i>
                <span>Chat</span>
            </a>
            <a href="moments.html" class="nav-item">
                <i class="fa-solid fa-images"></i>
                <span>Momentos</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>Perfil</span>
            </a>
        </nav>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- app.js PRIMERO (define window.getMyId), luego módulos -->
    <script src="js/app.js"></script>
    <script type="module" src="js/location.js"></script>
    <script type="module" src="js/map.js"></script>
</body>
</html>
